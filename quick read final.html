<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quick Read v7.5 — Universal Document Reader</title>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>


  <!-- Parsers (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pptx2json@1.3.0/dist/pptx2json.min.js"></script>

  <style>
    /* ===== Base Reset ===== */
    *{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%}
    body{
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg,#e8f1ff,#f7fbff);
      color:#071233;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow:hidden;
    }
    body.dark {
      background: linear-gradient(180deg,#071225,#071831);
      color:#e6eef8;
    }

    /* ===== Header (compact) ===== */
    header{
      display:flex;align-items:center;justify-content:space-between;
      gap:1rem;padding:14px 22px;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 8px 30px rgba(7,18,51,0.08);
      border-bottom-left-radius:12px;border-bottom-right-radius:12px;
      position:sticky;top:0;z-index:50;
      transition:background 0.3s, box-shadow 0.3s;
    }
    body.dark header{
      background: rgba(8,10,23,0.6);
      box-shadow: 0 10px 40px rgba(2,6,23,0.6);
    }
    .brand{
      display:flex;align-items:center;gap:12px;
    }
    .brand .logo{
      width:40px;height:40px;border-radius:8px;
      display:inline-flex;align-items:center;justify-content:center;
      background:linear-gradient(180deg,#ff7a59,#ff4d2e);color:white;font-weight:700;
      box-shadow: 0 6px 18px rgba(255,77,46,0.18);
    }
    .brand h1{font-size:1.25rem;color:#0b3aa6}
    body.dark .brand h1{color:#7fd3ff}
    .tagline{font-size:0.9rem;color:#475569;margin-left:8px}
    body.dark .tagline{color:#9fb6c9}

    /* Nav */
    nav.links{display:flex;gap:18px;align-items:center}
    nav.links a{
      text-decoration:none;color:inherit;padding:8px 12px;border-radius:10px;font-weight:600;
      transition: all 0.18s ease;
    }
    nav.links a.active{
      background: linear-gradient(90deg,#0b63ff,#00d0ff);
      color:white;box-shadow:0 8px 26px rgba(11,99,255,0.22);
    }
    nav.links a:hover{transform:translateY(-3px)}

    .header-actions{display:flex;align-items:center;gap:10px}

    .theme-toggle{
      background: linear-gradient(90deg,#0b63ff,#00d0ff);
      color:white;padding:8px 10px;border-radius:10px;border:none;cursor:pointer;
      box-shadow:0 8px 20px rgba(11,99,255,0.16);font-weight:700;
      transition:transform 0.18s, box-shadow 0.18s;
    }
    .theme-toggle:hover{transform:translateY(-3px)}

    /* ===== Layout ===== */
    .workspace{
      display:grid;
      grid-template-columns:320px 1fr;
      gap:28px;
      padding:28px;
      height:calc(100% - 86px);
      overflow:hidden;
    }
    @media (max-width:980px){
      .workspace{grid-template-columns:1fr; padding:16px; height:auto}
    }

    /* Sidebar */
    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(245,249,255,0.95));
      border-radius:14px;padding:18px;height:100%;overflow:auto;
      box-shadow: 0 12px 34px rgba(7,18,51,0.06);
      border: 1px solid rgba(11,63,180,0.04);
    }
    body.dark .panel{
      background: linear-gradient(180deg, rgba(8,12,22,0.6), rgba(6,10,18,0.6));
      border:1px solid rgba(255,255,255,0.04);
      box-shadow:0 14px 36px rgba(0,0,0,0.6);
    }

    .panel h3{color:#0b63ff;margin-bottom:8px;font-weight:700}
    body.dark .panel h3{color:#7fd3ff}

    .recent-list{display:flex;flex-direction:column;gap:10px}
    .recent-item{
      display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:10px;
      background:rgba(255,255,255,0.85);border:1px solid rgba(11,63,180,0.04);cursor:pointer;
      transition:transform 0.15s, box-shadow 0.15s;
    }
    .recent-item:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(11,99,255,0.06)}
    body.dark .recent-item{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.03)}

    .muted{color:#6b7280;font-size:0.95rem}
    body.dark .muted{color:#9ca3af}

    .btn{padding:10px 14px;border-radius:10px;border:none;font-weight:700;cursor:pointer}
    .btn.primary{background:linear-gradient(90deg,#0b63ff,#00d0ff);color:white;box-shadow:0 10px 30px rgba(11,99,255,0.16)}
    .btn.ghost{background:transparent;border:1px solid rgba(11,63,180,0.08);color:#0b3aa6}
    body.dark .btn.ghost{border:1px solid rgba(255,255,255,0.06);color:#9fdcff}

    /* Main card */
    .card{
      background: linear-gradient(180deg, white, #fbfdff); border-radius:16px; padding:26px; height:100%; overflow:auto;
      box-shadow: 0 18px 40px rgba(7,18,51,0.06); border:1px solid rgba(11,63,180,0.04);
    }
    body.dark .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border:1px solid rgba(255,255,255,0.03)}

    .hero{ text-align:center;padding:18px 10px;margin-bottom:18px }
    .hero h2{font-size:2rem;color:#0b63ff;margin-bottom:6px}
    body.dark .hero h2{color:#7fd3ff}
    .hero p{color:#475569}
    body.dark .hero p{color:#9fb6c9}

    .upload-box{
      border:2px dashed rgba(11,99,255,0.18);border-radius:12px;padding:34px;margin:18px auto;max-width:820px;
      display:flex;flex-direction:column;align-items:center;gap:10px;background:linear-gradient(180deg,#fff,#f5f9ff);
    }
    .upload-box:hover{box-shadow:0 18px 40px rgba(11,99,255,0.06);transform:translateY(-4px)}
    body.dark .upload-box{background:rgba(255,255,255,0.02);border-color:rgba(56,189,248,0.12)}

    .upload-cta{background:linear-gradient(90deg,#0b63ff,#00d0ff);color:white;padding:12px 18px;border-radius:12px;box-shadow:0 12px 30px rgba(11,99,255,0.14);font-weight:800}

    .search-row{display:flex;gap:10px;align-items:center;margin-top:14px}
    .search-row input[type="text"]{flex:1;padding:12px;border-radius:12px;border:1px solid rgba(11,63,180,0.06);outline:none;font-size:1rem}
    body.dark .search-row input{border:1px solid rgba(255,255,255,0.06);background:rgba(0,0,0,0.03);color:inherit}

    .file-viewer{margin-top:18px;padding:18px;border-radius:12px;background:linear-gradient(180deg,#fbfbff,#f6fbff);min-height:260px;white-space:pre-wrap;line-height:1.6;border:1px solid rgba(11,63,180,0.04)}
    body.dark .file-viewer{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.03)}

    mark{background:#fde047;color:#071225;padding:2px 4px;border-radius:4px}
    mark.active{background:#f97316;color:white}
    body.dark mark{background:#3b82f6;color:#f3f4f6}
    body.dark mark.active{background:#38bdf8;color:#071225}

    .inline-arrows{display:flex;gap:8px;align-items:center}
    .arrow{padding:8px 10px;border-radius:8px;border:none;background:rgba(11,63,180,0.06);cursor:pointer}
    .arrow:hover{transform:translateY(-2px)}
    body.dark .arrow{background:rgba(255,255,255,0.03)}

    footer{padding:14px;text-align:center;color:#6b7280;font-size:0.9rem}
    body.dark footer{color:#9ca3af}

    /* Focus ring */
    :focus{outline:none}
    button:focus,input:focus{box-shadow:0 8px 26px rgba(147,197,253,0.28);border-radius:8px}

  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
// === React + Utility Functions ===
// === React + Utility Functions ===
const { useState, useEffect } = React;

/* ---------- Theme Hook ---------- */
function useTheme() {
  const [dark, setDark] = useState(localStorage.getItem("theme") === "dark");
  useEffect(() => {
    document.body.classList.toggle("dark", dark);
    localStorage.setItem("theme", dark ? "dark" : "light");
  }, [dark]);
  return [dark, setDark];
}

/* ---------- Text Highlight Utility ---------- */
function highlightText(text, query, activeIndex) {
  if (!query) return text;
  const regex = new RegExp(`(${query})`, "gi");
  let i = -1;
  return text.split(regex).map((part, idx) => {
    if (part.toLowerCase() === query.toLowerCase()) {
      i++;
      return (
        <mark key={idx} className={i === activeIndex ? "active" : ""}>
          {part}
        </mark>
      );
    }
    return part;
  });
}

/* ---------- File Parsing Helpers ---------- */
// ✅ PDF Parser (pdf.js)
async function parsePDF(arrayBuffer) {
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
  } else {
    throw new Error("pdfjsLib not found (pdf.js not loaded).");
  }

  const uint8 = new Uint8Array(arrayBuffer);
  const loadingTask = pdfjsLib.getDocument({ data: uint8 });
  const pdf = await loadingTask.promise;

  let fullText = "";
  for (let p = 1; p <= pdf.numPages; ++p) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const pageText = content.items.map((itm) => itm.str).join(" ");
    fullText += `\n--- Page ${p} ---\n` + pageText + "\n\n";
  }
  return fullText;
}

// ✅ DOCX Parser
async function parseDOCX(arrayBuffer) {
  const result = await mammoth.extractRawText({ arrayBuffer });
  return result.value;
}

// ✅ XLS / XLSX Parser
async function parseXLS(arrayBuffer) {
  const workbook = XLSX.read(arrayBuffer, { type: "array" });
  let text = "";
  workbook.SheetNames.forEach((sheetName) => {
    const sheet = workbook.Sheets[sheetName];
    text += `\n--- Sheet: ${sheetName} ---\n`;
    text += XLSX.utils.sheet_to_csv(sheet) + "\n";
  });
  return text;
}

// ✅ PPTX Parser (JSZip + DOMParser) — Works Offline
async function parsePPT(arrayBuffer) {
  try {
    const zip = await JSZip.loadAsync(arrayBuffer);
    const slideFiles = Object.keys(zip.files).filter((name) =>
      name.match(/ppt\/slides\/slide\d+\.xml$/)
    );
    const slides = [];

    for (const slideName of slideFiles) {
      const xmlText = await zip.files[slideName].async("string");
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");

      // Extract all <a:t> text nodes
      const textNodes = Array.from(xmlDoc.getElementsByTagName("a:t"));
      const slideText = textNodes.map((node) => node.textContent).join(" ");
      slides.push({ title: `Slide ${slides.length + 1}`, text: slideText });
    }

    if (slides.length === 0)
      return "No readable text found in this presentation.";

    // Combine all slides for final output
    return slides.map((s) => `--- ${s.title} ---\n${s.text}`).join("\n\n");
  } catch (err) {
    console.error("PPT parse error:", err);
    return "Unable to extract PowerPoint text. Please check file format.";
  }
}
// === End of Part 2 ===
// === Main App Component ===
function QuickReadApp() {
  const [dark, setDark] = useTheme();
  const [activeTab, setActiveTab] = useState("home");
  const [files, setFiles] = useState([]);
  const [selectedFile, setSelectedFile] = useState(null);
  const [fileText, setFileText] = useState("");
  const [searchQuery, setSearchQuery] = useState("");
  const [matches, setMatches] = useState([]);
  const [matchIndex, setMatchIndex] = useState(0);

  /* ---------- File Upload ---------- */
  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const ext = file.name.split(".").pop().toLowerCase();
    const reader = new FileReader();

    reader.onload = async (ev) => {
      try {
        const buf = ev.target.result;
        let content = "";
        if (["txt", "csv"].includes(ext))
          content = new TextDecoder("utf-8").decode(buf);
        else if (ext === "pdf") content = await parsePDF(buf);
        else if (["doc", "docx"].includes(ext)) content = await parseDOCX(buf);
        else if (["xls", "xlsx"].includes(ext)) content = await parseXLS(buf);
        else if (["ppt", "pptx"].includes(ext)) content = await parsePPT(buf);
        else {
          alert("Unsupported file type.");
          return;
        }

        const newFile = { name: file.name, content };
        setFiles((prev) => {
          const updated = [...prev, newFile];
          localStorage.setItem("recentUploads", JSON.stringify(updated));
          return updated;
        });
        setSelectedFile(newFile);
        setFileText(content);
        setSearchQuery("");
      } catch (err) {
        alert("Error reading file.");
        console.error(err);
      }
    };
    reader.readAsArrayBuffer(file);
  };

  /* ---------- Reset Viewer ---------- */
  const resetViewer = () => {
    setSelectedFile(null);
    setFileText("");
    setSearchQuery("");
    setMatches([]);
    setMatchIndex(0);
  };

  /* ---------- Load Recent on Mount ---------- */
  useEffect(() => {
    const saved = localStorage.getItem("recentUploads");
    if (saved) setFiles(JSON.parse(saved));
  }, []);

  /* ---------- Search Handling ---------- */
  useEffect(() => {
    if (!searchQuery) {
      setMatches([]);
      setMatchIndex(0);
      return;
    }
    const regex = new RegExp(searchQuery, "gi");
    const found = [...fileText.matchAll(regex)].map((m) => m.index);
    setMatches(found);
    setMatchIndex(0);
  }, [searchQuery, fileText]);

  const nextMatch = () => {
    if (matches.length === 0) return;
    setMatchIndex((i) => (i + 1) % matches.length);
  };
  const prevMatch = () => {
    if (matches.length === 0) return;
    setMatchIndex((i) => (i - 1 + matches.length) % matches.length);
  };

  useEffect(() => {
    const el = document.querySelector("mark.active");
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
  }, [matchIndex]);

  /* ---------- Tab Content ---------- */
  const renderHome = () => (
    <div className="workspace">
      <div className="panel">
        <h3>Recent Uploads</h3>
        <div className="recent-list">
          {files.length === 0 ? (
            <p className="muted">No uploads yet — load a document.</p>
          ) : (
            files.map((f, i) => (
              <div
                key={i}
                className="recent-item"
                onClick={() => {
                  setSelectedFile(f);
                  setFileText(f.content);
                  setSearchQuery("");
                }}
              >
                <span>{f.name}</span>
              </div>
            ))
          )}
        </div>
        <br />
        <h3>Actions</h3>
        {/* ✅ Updated Clear Recent Button */}
        <button
          className="btn primary"
          onClick={() => {
            localStorage.removeItem("recentUploads"); // clear only Quick Read data
            setFiles([]);           // clear sidebar
            setSelectedFile(null);  // clear current file
            setFileText("");        // clear viewer
            setSearchQuery("");     // clear search
            alert("Recent uploads cleared successfully!");
          }}
        >
          Clear Recent
        </button>

        <button className="btn ghost" onClick={resetViewer}>
          Reset Viewer
        </button>
      </div>

      <div className="card">
        <div className="hero">
          <h2>Welcome to Quick Read</h2>
          <p>Upload, read, and instantly search any document.</p>
        </div>

        {/* ✅ Drag & Drop Upload Box */}
<div
  className="upload-box"
  onDragOver={(e) => {
    e.preventDefault();
    e.stopPropagation();
    e.currentTarget.classList.add("drag-over");
  }}
  onDragLeave={(e) => {
    e.preventDefault();
    e.stopPropagation();
    e.currentTarget.classList.remove("drag-over");
  }}
  onDrop={(e) => {
    e.preventDefault();
    e.stopPropagation();
    e.currentTarget.classList.remove("drag-over");

    const file = e.dataTransfer.files?.[0];
    if (file) {
      const fakeEvent = { target: { files: [file] } };
      handleFileUpload(fakeEvent);
    }
  }}
>
  <div className="upload-cta">Drag & Drop or Click to Upload</div>
  <p className="muted">
    Supported: .txt • .docx • .pdf • .xlsx • .pptx
  </p>
  <input
    type="file"
    onChange={handleFileUpload}
    accept=".txt,.docx,.pdf,.xlsx,.xls,.pptx,.csv"
    style={{ marginTop: "10px" }}
  />
</div>


        <div className="search-row">
          <input
            type="text"
            placeholder="Search inside this document…"
            value={searchQuery}
            onChange={(e) => setSearchQuery(e.target.value)}
          />
          {matches.length > 0 && (
            <div className="inline-arrows">
              <button className="arrow" onClick={prevMatch}>↑</button>
              <button className="arrow" onClick={nextMatch}>↓</button>
              <span className="muted">
                {matchIndex + 1}/{matches.length}
              </span>
            </div>
          )}
        </div>

        <div className="file-viewer">
          {selectedFile ? (
            <>{highlightText(fileText, searchQuery, matchIndex)}</>
          ) : (
            <p className="muted">No document loaded — upload a file to begin.</p>
          )}
        </div>
      </div>
    </div>
  );

  const renderAbout = () => (
    <div className="card" style={{ margin: "24px" }}>
      <div className="hero">
        <h2>About Quick Read</h2>
        <p>
          <strong>Quick Read v7.6</strong> is a multi-format document reader designed for rapid keyword search and organization.
        </p>
      </div>
      <p style={{ lineHeight: 1.6 }}>
        It supports <b>.txt</b>, <b>.csv</b>, <b>.pdf</b>, <b>.docx</b>, <b>.xlsx</b>, and <b>.pptx</b> files. Drag, drop, and read instantly in light or dark mode.
      </p>
    </div>
  );

  const renderHelp = () => (
    <div className="card" style={{ margin: "24px" }}>
      <div className="hero">
        <h2>Help & Support</h2>
        <p>Common questions and tips for using Quick Read.</p>
      </div>
      <ul style={{ lineHeight: 1.7, marginLeft: "20px" }}>
        <li>📂 Use the “Choose File” button or drag and drop to upload.</li>
        <li>🔍 Type in the search box to highlight matching words.</li>
        <li>⬆⬇ Use the arrow buttons to jump through matches.</li>
        <li>🌗 Toggle the theme icon to switch light/dark mode.</li>
        <li>🧹 Use “Reset Viewer” to clear the current file.</li>
      </ul>
    </div>
  );
// === End of Part 3 ===

// === Header, Navigation & Footer ===
  const renderNav = () => (
    <header>
      <div className="brand">
        <div className="logo">QR</div>
        <div>
          <h1>Quick Read</h1>
          <span className="tagline">Universal Document Reader</span>
        </div>
      </div>

      <nav className="links">
        <a
          href="#"
          className={activeTab === "home" ? "active" : ""}
          onClick={() => setActiveTab("home")}
        >
          Home
        </a>
        <a
          href="#"
          className={activeTab === "about" ? "active" : ""}
          onClick={() => setActiveTab("about")}
        >
          About
        </a>
        <a
          href="#"
          className={activeTab === "help" ? "active" : ""}
          onClick={() => setActiveTab("help")}
        >
          Help
        </a>
      </nav>

      <div className="header-actions">
        <button
          className="theme-toggle"
          onClick={() => setDark(!dark)}
          title="Toggle theme"
        >
          {dark ? "☀️" : "🌙"}
        </button>
      </div>
    </header>
  );

  const renderFooter = () => (
    <footer>
      © 2025 Quick Read — Designed with 💙 for clarity and speed
    </footer>
  );

  /* ---------- Render Tabs ---------- */
  return (
    <>
      {renderNav()}
      {activeTab === "home" && renderHome()}
      {activeTab === "about" && renderAbout()}
      {activeTab === "help" && renderHelp()}
      {renderFooter()}
    </>
  );
}
// === End of Part 4 ===
// === Final Render Mount ===
ReactDOM.createRoot(document.getElementById("root")).render(<QuickReadApp />);

  </script>
</body>
</html>
